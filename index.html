<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Cadence — a calm, focus-first study app with a Pomodoro timer, tasks, and ambient sound."
    />
    <title>Cadence — focus timer</title>
    <script>
      // Apply the saved theme AND accent tint before first paint to avoid a
      // flash of the wrong background. Dark mode is the default.
      (function () {
        var root = document.documentElement;
        try {
          var saved = localStorage.getItem('cadence:theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          root.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          /* localStorage unavailable — keep the default dark class */
        }
        try {
          // Mirror the store's applyAccent(): set --accent + .tinted so the
          // whole palette is derived from the saved color on first paint.
          var persisted = JSON.parse(localStorage.getItem('cadence:state'));
          var accent = persisted && persisted.state && persisted.state.accent;
          if (accent) {
            root.style.setProperty('--accent', accent);
            root.classList.add('tinted');
          }
        } catch (e) {
          /* no/invalid persisted state — stay monochrome */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
